name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk python3-pip zip unzip git
          sudo apt install -y libncurses6 libtinfo6 libncurses-dev libtinfo-dev zlib1g-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36
      - name: Build APK
        run: |
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-APK
          path: bin/*.apk