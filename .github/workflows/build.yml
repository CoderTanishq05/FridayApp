name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install Buildozer
        run: |
          pip install buildozer cython
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 libssl-dev libbz2-dev libsqlite3-dev libreadline-dev liblzma-dev zip unzip
      - name: Build APK
        run: |
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-APK
          path: bin/*.apk