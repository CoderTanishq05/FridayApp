name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4

      - name: Build APK
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: master
          workdir:.

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-APK
          path: bin/*.apk